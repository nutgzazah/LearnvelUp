name: Recommend Service Deploy to Railway

on:
  push:
    paths:
      - "recommend_service/**"
      - ".github/workflows/recommend-deploy.yml"
    branches: [recommend-cicd]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - run: |
          cd recommend_service
          pip install -r requirements.txt -r requirements-dev.txt
          pytest tests/ || true

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Railway
        run: npm install -g @railway/cli && railway up
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
